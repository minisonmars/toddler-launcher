<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toddler Launcher remote</title>
<style>
  :root { --green:#34b37a; --red:#e13c3c; --orange:#ff961e; --bg:#f4f6f5; --card:#fff; --text:#1d2420; --grey:#6b746f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121614; --card:#1d2320; --text:#e8ece9; --grey:#9aa49e; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  header { background:var(--green); color:#fff; padding:16px; position:sticky; top:0; z-index:2; }
  header h1 { margin:0; font-size:20px; }
  header small { opacity:.9; }
  main { padding:12px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:12px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size:17px; margin:0 0 10px; color:var(--green); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid rgba(128,128,128,.15); }
  .row:last-child { border-bottom:none; }
  .row label { flex:1; }
  .note { color:var(--grey); font-size:14px; margin:6px 0; }
  .warn { color:var(--red); font-weight:600; }
  button { font-size:16px; border:none; border-radius:10px; padding:11px 14px; background:var(--green); color:#fff; margin:4px 6px 4px 0; }
  button.secondary { background:rgba(128,128,128,.2); color:var(--text); }
  button.danger { background:var(--red); }
  select, input[type=text], input[type=password], input[type=time] { font-size:16px; padding:8px; border-radius:8px; border:1px solid rgba(128,128,128,.4); background:var(--card); color:var(--text); max-width:55vw; }
  input[type=checkbox] { width:26px; height:26px; accent-color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:6px 4px; text-align:right; border-bottom:1px solid rgba(128,128,128,.15); }
  td:first-child, th:first-child { text-align:left; }
  tr.total td { font-weight:700; }
  #login { max-width:360px; margin:40px auto; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#333; color:#fff; padding:10px 16px; border-radius:10px; display:none; max-width:90vw; z-index:5; }
  .big { font-size:22px; font-weight:700; }
  .menu { display:flex; align-items:center; gap:14px; padding:10px 4px; border-bottom:1px solid rgba(128,128,128,.15); cursor:pointer; }
  .menu:last-child { border-bottom:none; }
  .menu img { width:48px; height:48px; flex:none; }
  .menu .t { font-size:18px; font-weight:700; }
  .menu .s { color:var(--grey); font-size:14px; }
  .menu .s.warn { color:var(--red); }
  .check { display:flex; align-items:center; gap:12px; padding:6px 0; font-weight:700; font-size:17px; }
  .check img { width:34px; height:34px; }
  h1.sec { display:flex; align-items:center; gap:12px; font-size:22px; margin:8px 0; }
  h1.sec img { width:40px; height:40px; }
</style>
</head>
<body>
<header><h1>Toddler Launcher</h1><small id="sub">Remote parent access</small></header>
<main>
  <div id="login" class="card">
    <h2>Parent PIN</h2>
    <p class="note">Enter the same PIN you use on the toddler device.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%;max-width:none">
    <p><button onclick="login()">Log in</button></p>
    <p id="loginMsg" class="warn"></p>
  </div>
  <div id="app" style="display:none"></div>
</main>
<div id="toast"></div>
<script>
var token = sessionStorage.getItem('tl-token') || '';
var st = null;

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3500);
}

function api(path, body) {
  return fetch('/api/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Token': token },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().then(function (j) {
      if (r.status === 401 && path !== 'login') { showLogin('Please log in again.'); throw new Error('login'); }
      if (!r.ok) throw new Error(j.error || 'Something went wrong');
      return j;
    });
  });
}

function showLogin(msg) {
  token = ''; sessionStorage.removeItem('tl-token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('loginMsg').textContent = msg || '';
}

function login() {
  var pin = document.getElementById('pin').value;
  api('login', { pin: pin }).then(function (j) {
    token = j.token; sessionStorage.setItem('tl-token', token);
    document.getElementById('pin').value = '';
    load();
  }).catch(function (e) { document.getElementById('loginMsg').textContent = e.message; });
}
document.getElementById('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

function load() {
  api('state').then(function (j) {
    st = j;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    render();
  }).catch(function (e) { if (e.message !== 'login') toast(e.message); });
}

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function card(title, children) { return el('div', { 'class': 'card' }, [el('h2', { text: title })].concat(children)); }

function hhmm(m) { m = parseInt(m, 10); var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; }

function settingRow(s) {
  var input;
  if (s.type === 'bool') {
    input = el('input', { type: 'checkbox' });
    input.checked = s.value === 'true';
    input.onchange = function () { set(s.key, input.checked); };
  } else if (s.type === 'time') {
    input = el('input', { type: 'time', value: hhmm(s.value) });
    input.onchange = function () { var p = input.value.split(':'); set(s.key, String(parseInt(p[0], 10) * 60 + parseInt(p[1], 10))); };
  } else {
    input = el('select');
    s.options.forEach(function (o) {
      var opt = el('option', { value: o[0], text: o[1] });
      if (o[0] === s.value) opt.selected = true;
      input.appendChild(opt);
    });
    input.onchange = function () { set(s.key, input.value); };
  }
  return el('div', { 'class': 'row' }, [el('label', { text: s.label }), input]);
}

function set(key, value) {
  api('set', { key: key, value: value }).then(function () { toast('Saved'); setTimeout(load, 400); })
    .catch(function (e) { toast(e.message); });
}

function act(path, body, msg) {
  api(path, body).then(function (j) { toast(j.message || msg || 'Done'); setTimeout(load, 400); })
    .catch(function (e) { toast(e.message); });
}

// The same menu and sections as the parent area on the toddler device
function section() { return (location.hash || '').replace('#', ''); }
window.addEventListener('hashchange', function () { if (st) { render(); window.scrollTo(0, 0); } });

function icon(name, colour) { return el('img', { src: '/icon/' + name + '.png?c=' + colour, alt: '' }); }
function note(text, cls) { return el('p', { 'class': cls || 'note', text: text }); }
function h2(text) { return el('h2', { text: text }); }

function nowStatus() {
  var out = [];
  out.push(el('div', { 'class': 'big', text: 'Today: ' + st.usedToday + (st.allowance !== 'No limit' ? ' of ' + st.allowance : '') }));
  if (st.bonus > 0) out.push(note('Including ' + st.bonus + ' extra minutes today.'));
  if (st.block) out.push(note('Toddler screen: ' + st.block, 'warn'));
  if (st.paused) out.push(note(st.pausedText, 'warn'));
  if (!st.guardEnabled) out.push(note('Toddler Guard is off in Android, so limits and blocking are not working.', 'warn'));
  return out;
}
function breakButton() {
  return st.lockedNow
    ? el('button', { 'class': 'secondary', text: 'End break time', onclick: function () { act('lock', { on: false }, 'Break time is over'); } })
    : el('button', { 'class': 'danger', text: 'Break time now', onclick: function () { act('lock', { on: true }, 'Break time'); } });
}
function bonusButtons(first) {
  return el('div', {}, [
    el('button', { text: first || '+15 minutes', onclick: function () { act('bonus', { min: 15 }, '15 minutes added'); } }),
    el('button', { text: '+30 minutes', onclick: function () { act('bonus', { min: 30 }, '30 minutes added'); } })
  ]);
}

// One section's settings, a card per heading, in the device's order. extra(header) adds things to that card.
function schemaCards(key, extra) {
  var items = st.settings.filter(function (s) { return s.section === key; });
  var hoursOn = items.filter(function (s) { return s.key === 'hoursOn'; })[0];
  var cards = [], current = null, header = null;
  items.forEach(function (s) {
    if (s.header !== header) {
      header = s.header;
      current = [h2(header)].concat((extra && extra('before:' + header)) || []);
      cards.push({ h: header, c: current });
    }
    if (s.header === 'Allowed hours' && s.key !== 'hoursOn' && hoursOn && hoursOn.value !== 'true') return;
    current.push(settingRow(s));
  });
  return cards.map(function (x) { return el('div', { 'class': 'card' }, x.c.concat((extra && extra(x.h)) || [])); });
}

function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('sub').textContent = (st.childName || st.name) + ' · ' + st.device + ' · version ' + st.version;
  if (!st.sections) { app.appendChild(card('Update needed', [note('Update Toddler Launcher on the toddler device.')])); return; }
  var key = section();
  var def = st.sections.filter(function (x) { return x.key === key; })[0];
  if (!def) return renderMenu(app);

  app.appendChild(el('h1', { 'class': 'sec' }, [icon(def.icon, def.colour), el('span', { text: def.title })]));
  app.appendChild(el('button', { 'class': 'secondary', text: 'Back', onclick: function () { location.hash = ''; } }));
  var add = function (x) { if (x.forEach) x.forEach(function (c) { app.appendChild(c); }); else app.appendChild(x); };
  ({
    checks: function () {
      add(el('div', { 'class': 'card' }, st.checks.map(function (c) {
        return el('div', { 'class': 'check' }, [icon(c.done ? 'CHECK' : 'CROSS', c.done ? '34B37A' : 'E13C3C'), el('span', { text: c.title })]);
      }).concat([note('To fix a cross, open Lock-down checks in the parent area on the toddler device.')])));
    },
    apps: function () {
      var allowed = [h2('Allowed apps'), note('Tick the apps your child can use.')];
      var limits = [h2('Daily time limit for each app')];
      st.apps.forEach(function (a) {
        var box = el('input', { type: 'checkbox' });
        box.checked = a.allowed;
        box.onchange = function () { act('app', { pkg: a.pkg, allowed: box.checked }, box.checked ? 'Allowed' : 'Removed'); };
        allowed.push(el('div', { 'class': 'row' }, [el('label', { text: a.label }), box]));
        if (a.allowed) {
          var sel = el('select');
          st.appLimitOptions.forEach(function (o) {
            var opt = el('option', { value: o[0], text: o[1] });
            if (parseInt(o[0], 10) === a.limit) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.onchange = function () { act('app', { pkg: a.pkg, limit: parseInt(sel.value, 10) }, 'Saved'); };
          limits.push(el('div', { 'class': 'row' }, [el('label', {}, [el('div', { text: a.label }), el('div', { 'class': 'note', text: 'Today: ' + a.today })]), sel]));
        }
      });
      if (limits.length === 1) limits.push(note('No apps allowed yet.'));
      add(el('div', { 'class': 'card' }, allowed));
      add(el('div', { 'class': 'card' }, limits));
    },
    recommended: function () { add(card('Recommended apps', [note('Install, update and open recommended apps from the parent area on the toddler device itself.')])); },
    time: function () {
      if (!st.guardEnabled) add(note('Toddler Guard is off in Android, so screen time can\'t be counted or limited.', 'warn'));
      add(schemaCards('time', function (h) {
        if (h === 'before:Daily limit') return [note('Counts time spent inside the apps, not on the toddler home screen.')];
        if (h === 'Daily limit') return nowStatus().concat([bonusButtons('Give 15 more minutes today'),
          note('Extra time is added to the daily limit and to each app\'s limit, for today only.'),
          h2('Break time'), breakButton(), note('Locks the toddler screen and every app until you end it.')]);
        if (h === 'before:Allowed hours') return [note('Outside these times the toddler screen shows "Sleep time" and no apps open.')];
      }));
    },
    report: function () {
      var table = el('table');
      table.appendChild(el('tr', {}, [el('th', { text: 'App' })].concat(st.reportDays.map(function (d) { return el('th', { text: d }); })).concat([el('th', { text: '7-day avg' })])));
      st.report.forEach(function (r) {
        table.appendChild(el('tr', r.total ? { 'class': 'total' } : {}, [el('td', { text: r.label })].concat(r.days.map(function (d) { return el('td', { text: d }); })).concat([el('td', { text: r.avg })])));
      });
      add(el('div', { 'class': 'card' }, [table, note('Time in apps in toddler mode. The average is the last 7 days divided by 7.')]));
    },
    look: function () {
      add(schemaCards('look', function (h) {
        if (h === 'before:Child\'s name') {
          var nameBox = el('input', { type: 'text', value: st.childName || '', placeholder: 'Name', maxlength: '20' });
          return [note('Shown at the top of the toddler screen in colourful letters. Leave it empty to hide it.'),
            el('div', { 'class': 'row' }, [el('label', { text: 'Name' }), nameBox]),
            el('button', { text: 'Save name', onclick: function () { act('name', { name: nameBox.value }, 'Name saved'); } })];
        }
        if (h === 'Wallpaper') return [note('To use a photo, choose it on the toddler device.')];
      }));
    },
    code: function () {
      var cur = el('input', { type: 'password', inputmode: 'numeric', placeholder: 'Current PIN' });
      var nw = el('input', { type: 'password', inputmode: 'numeric', placeholder: 'New PIN' });
      add(el('div', { 'class': 'card' }, [h2('Code'),
        st.defaultPin ? note('Still using the default PIN 0000.', 'warn') : null,
        note('Opens the parent area with: ' + (st.lockType === 'pattern' ? 'pattern' : 'PIN') + '. The pattern and recovery word are set on the device.'),
        el('div', { 'class': 'row' }, [el('label', { text: 'Current PIN' }), cur]),
        el('div', { 'class': 'row' }, [el('label', { text: 'New PIN (4 to 8 digits)' }), nw]),
        el('button', { text: 'Change PIN', onclick: function () { act('pin', { current: cur.value, 'new': nw.value }, 'PIN changed'); } })]));
      add(schemaCards('code'));
    },
    protect: function () {
      add(schemaCards('protect', function (h) {
        if (h !== 'Toddler Guard') return;
        return st.paused
          ? [note(st.pausedText, 'warn'), el('button', { text: 'Switch protection back on', onclick: function () { act('pause', { min: 0 }, 'Protection on'); } })]
          : [el('div', {}, [el('button', { 'class': 'secondary', text: 'Pause 15 min', onclick: function () { act('pause', { min: 15 }, 'Paused'); } }),
              el('button', { 'class': 'secondary', text: 'Pause 1 hour', onclick: function () { act('pause', { min: 60 }, 'Paused'); } })])];
      }));
    },
    connect: function () {
      add(el('div', { 'class': 'card' }, [h2('Wi-Fi: ' + (st.wifiOn ? 'on' : 'off')), h2('Mobile data: ' + (st.mobileData ? 'in use' : 'not in use')),
        h2('Bluetooth: ' + (st.bluetoothOn ? 'on' : 'off')), h2('Aeroplane mode: ' + (st.airplaneOn ? 'on' : 'off')),
        note('Android doesn\'t let apps switch these, so they can only be changed on the device.')]));
      var wifi = [h2('Wi-Fi networks')];
      if (!st.wifiSupported) wifi.push(note('Adding networks needs Android 10 or newer on the toddler device.'));
      else {
        wifi.push(note('Add a network and the toddler device joins it by itself whenever it is in range.'));
        var ssid = el('input', { type: 'text', placeholder: 'Network name' });
        var pass = el('input', { type: 'password', placeholder: 'Password' });
        wifi.push(el('div', { 'class': 'row' }, [el('label', { text: 'Name' }), ssid]));
        wifi.push(el('div', { 'class': 'row' }, [el('label', { text: 'Password' }), pass]));
        wifi.push(el('button', { text: 'Add network', onclick: function () { act('wifi/add', { ssid: ssid.value, password: pass.value }); } }));
        st.wifiNetworks.forEach(function (n) {
          wifi.push(el('div', { 'class': 'row' }, [el('label', { text: n }),
            el('button', { 'class': 'secondary', text: 'Remove', onclick: function () { act('wifi/remove', { ssid: n }); } })]));
        });
      }
      add(el('div', { 'class': 'card' }, wifi));
    },
    remote: function () {
      add(el('div', { 'class': 'card' }, [h2('Connection'), note('This page, on the same Wi-Fi. Addresses: ' + (st.addresses || []).join(', '))]));
      add(el('div', { 'class': 'card' }, [h2('Paired phones')].concat((st.pairedNames || []).map(function (n) { return note(n); }))
        .concat([note('The Toddler Parent app finds this device by itself on the same Wi-Fi.')])));
      add(el('div', { 'class': 'card' }, [el('button', { 'class': 'secondary', text: 'Log out', onclick: function () { api('logout').finally(function () { showLogin(''); }); } })]));
    },
    updates: function () {
      add(el('div', { 'class': 'card' }, [h2('App updates'), note('The toddler device has version ' + st.version + '.'),
        st.latestVersion ? note('Version ' + st.latestVersion + ' is ready. Install it from Updates and backup on the device.', 'warn') : note('It is up to date (as of its last check).'),
        h2('Backup'), note('Save and restore settings files on the device itself.')]));
    },
    device: function () {
      add(el('div', { 'class': 'card' }, [h2('About'), note(st.device + ', Android ' + st.android),
        st.battery !== undefined ? note('Battery ' + st.battery + '%' + (st.charging ? ' (charging)' : '')) : null,
        note(st.defaultHome ? 'Toddler Launcher is the home app.' : 'Toddler Launcher is NOT the home app.', st.defaultHome ? 'note' : 'warn'),
        note('Using your normal home screen for a while, changing the home app and uninstalling are done on the device.')]));
    }
  }[key] || function () {})();
}

function renderMenu(app) {
  app.appendChild(card('Now', nowStatus().concat([bonusButtons(), breakButton(),
    el('button', { 'class': 'secondary', text: 'Refresh', onclick: load })])));
  app.appendChild(el('div', { 'class': 'card' }, [h2('Parent area')].concat(st.sections.map(function (x) {
    return el('div', { 'class': 'menu', onclick: function () { location.hash = x.key; } }, [
      icon(x.icon, x.warn ? 'E13C3C' : x.colour),
      el('div', {}, [el('div', { 'class': 't', text: x.title }), el('div', { 'class': 's' + (x.warn ? ' warn' : ''), text: x.subtitle })])
    ]);
  }))));
}

if (token) load();
// Keep the connection alive (and the remote icon showing) while this page is open
setInterval(function () { if (token && document.visibilityState === 'visible') api('state').then(function (j) { st = j; }).catch(function () {}); }, 45000);
</script>
</body>
</html>
