name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Change the first two numbers here to bump the version; the last is the build number
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APKs (launcher GitHub version and parent app)
        run: gradle :app:assembleGithubRelease :parent:assembleRelease --no-daemon

      # The Google Play version (AAB), signed with the upload key. The key is never in the
      # (public) repo: it comes from the PLAY_UPLOAD_KEYSTORE secret (the key file as base64 text)
      # and PLAY_KEY_PASSWORD. Skipped until both secrets are set up.
      - name: Build Google Play version (AAB)
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ] || [ -z "$PLAY_KEY_PASSWORD" ]; then
            echo "Play secrets not set: skipping the Play version"
          else
            echo "$PLAY_UPLOAD_KEYSTORE" | tr -d ' \r\n' | base64 -d > app/upload.keystore
            gradle :app:bundlePlayRelease --no-daemon
            cp app/build/outputs/bundle/playRelease/app-play-release.aab "ToddlerLauncherPlay-v${APP_VERSION}.aab"
          fi

      # The Play version as an APK too, so it can be tried out without Play. It's a separate app
      # (uk.co.minisonmars.toddlerlauncher), so it never replaces the GitHub version.
      - name: Build Google Play version test APK
        env:
          PLAY_TEST_APK: "1"
        run: |
          gradle :app:assemblePlayRelease --no-daemon
          cp app/build/outputs/apk/play/release/app-play-release.apk "ToddlerLauncherPlay-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: toddler-launcher-apk
          path: |
            app/build/outputs/apk/github/release/app-github-release.apk
            ToddlerLauncherPlay-*
            parent/build/outputs/apk/release/parent-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "ToddlerLauncher-v${APP_VERSION}.apk"
          cp parent/build/outputs/apk/release/parent-release.apk "ToddlerParent-v${APP_VERSION}.apk"
          # Release notes = the "Next" section of CHANGELOG.md
          python3 .github/scripts/changelog.py notes > notes.md
          # The Play AAB is attached too (when built), for uploading to Play Console by hand
          gh release create "v${APP_VERSION}" "ToddlerLauncher-v${APP_VERSION}.apk" "ToddlerParent-v${APP_VERSION}.apk" \
            $(ls ToddlerLauncherPlay-*.aab 2>/dev/null) \
            --title "Toddler Launcher v${APP_VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          # Named "ToddlerLauncherPlay-" so GitHub lists it after "ToddlerLauncher-v…" (assets are listed
          # by name): older versions' updaters take the first launcher APK, so they never pick it
          gh release upload "v${APP_VERSION}" "ToddlerLauncherPlay-v${APP_VERSION}.apk"
          # v0.1.31's Play APK was listed first, so older updaters could pick it: remove it
          gh release delete-asset v0.1.31 "ToddlerLauncher-Play-v0.1.31.apk" -y 2>/dev/null || true

      - name: Update the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rename "Next" to this version in CHANGELOG.md and commit it back
          python3 .github/scripts/changelog.py stamp "${APP_VERSION}"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Changelog for v${APP_VERSION}"
            git push origin HEAD:main || echo "Changelog push skipped (main moved on)"
          fi
          # Keep every release's notes on GitHub the same as CHANGELOG.md
          for tag in $(python3 .github/scripts/changelog.py tags); do
            python3 .github/scripts/changelog.py section "$tag" > section.md
            gh release edit "$tag" --notes-file section.md >/dev/null 2>&1 || true
          done
